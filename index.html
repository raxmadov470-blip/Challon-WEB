<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F2EC">
<title>CHALLON</title>
<style>
:root{--bg:#F4F2EC;--card:#fff;--ink:#16202E;--mut:#5C6675;--line:#E2DED3;--pri:#0E5A52;--pri2:#0A443E;--tint:#E6F0EE;--amber:#B9741A;--good:#2F7D4F;--goodbg:#E7F3EB;--bad:#B3402E;--badbg:#FAEAE6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{max-width:520px;margin:0 auto;padding:18px 16px 110px;min-height:100vh}
h1{font-size:24px;line-height:1.3;margin:10px 0 16px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 6px;font-weight:700}
p{margin:0 0 12px;color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
.brand{font-weight:800;letter-spacing:.22em;font-size:15px;color:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;min-height:36px}
.login{padding-top:9vh}.login .brand{font-size:26px;text-align:center}
.tag{text-align:center;margin:8px 0 26px}
.fine{font-size:13px;color:var(--mut);text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 12px}
.card.center,.center{text-align:center}
#gg{display:flex;justify-content:center;min-height:44px}#gg.busy{opacity:.45;pointer-events:none}
.hint{font-size:12px;color:var(--mut);margin:12px 0 0}
.card.done{background:var(--goodbg);border-color:#CFE5D6}.card.done p{color:var(--good);margin:0}
.card.muted{background:transparent}.card.muted p{margin:0}
.card.good{background:var(--goodbg);border-color:#CFE5D6;color:var(--good);font-weight:600}
.label{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:10px;letter-spacing:.02em}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font-weight:600}
.chip.on{border-color:var(--pri);background:var(--tint);color:var(--pri)}
input{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{display:block;width:100%;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;min-height:50px}
.btn:active{background:var(--pri2)}
.btn.ghost{background:#fff;color:var(--pri)}
.btn:disabled{opacity:.38;cursor:default}
.link{background:none;border:0;color:var(--mut);padding:8px 4px;font-weight:600}
.link.small{font-size:13px;font-weight:500;text-decoration:underline}
.stats{display:flex;gap:8px;margin:0 0 14px}
.stats>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:17px;line-height:1.3}.stats span{font-size:11.5px;color:var(--mut);line-height:1.25;display:block}
.xp{color:var(--amber);font-weight:700}
.runhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar{flex:1;height:8px;background:#E4E0D6;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:8px}
.count{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.qtag{font-size:13px;font-weight:600;color:var(--pri);margin-bottom:12px}
.stem{font-size:20px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;word-break:keep-all}
.stem.big{font-size:30px;text-align:center;padding:26px 14px;font-weight:700}
.passage{font-size:17px;line-height:1.8;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;word-break:keep-all}
.question{font-weight:700;margin:4px 2px 12px}
.note{font-size:13px;color:var(--amber);margin-bottom:8px}
.hint{font-size:13px;color:var(--mut);margin-bottom:8px}
.audio{border:1px solid var(--pri);background:var(--tint);color:var(--pri);border-radius:40px;padding:16px 30px;font-weight:700;font-size:17px;margin:6px 0 4px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;font-size:17px;min-height:54px;word-break:keep-all}
.opt.sel{border-color:var(--pri);background:var(--tint)}
.opt.good{border-color:var(--good);background:var(--goodbg);color:var(--good);opacity:1}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);opacity:1}
.opt:disabled{cursor:default}
.slots{min-height:62px;border:1.5px dashed #BDB7A8;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:#FBFAF6}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-width:46px;height:46px;font-size:20px;font-weight:600;padding:0 10px}
.tile.on{border-color:var(--pri);background:var(--tint)}
.tile:disabled:not(.on){opacity:.25}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px}.fb.good{background:var(--goodbg);color:var(--good)}.fb.bad{background:var(--badbg);color:var(--bad)}
.reveal{color:var(--ink);margin-top:6px;font-size:16px}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(244,242,236,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.foot .btn{max-width:170px;padding:12px 8px;font-size:15px}
.bigscore{font-size:52px;font-weight:800;line-height:1.1;letter-spacing:-.02em}.bigscore small{font-size:18px;color:var(--mut);font-weight:600}
.lvl{font-size:40px;font-weight:800;color:var(--pri)}
.delta{font-weight:700;margin-top:8px}.delta.up{color:var(--good)}.delta.down{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row span{width:92px;font-size:14px}.row b{width:44px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:10px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.col i{display:block;width:100%;max-width:46px;background:var(--pri);border-radius:6px 6px 0 0}.col i.base{background:#9DB5B1}
.col b{font-size:14px}.col span{font-size:12px;color:var(--mut)}
.pill{display:inline-block;background:var(--tint);color:var(--pri);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match>div{display:grid;gap:10px;align-content:start}.match .opt{text-align:center;font-size:16px;padding:10px 8px}
.toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;text-align:center;z-index:9}
.hello{margin-top:6px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>

<script>
/* CHALLON student web app */
(function () {
var E = window.CHALLON_ENGINE, I = window.CHALLON_I18N, B = E.parse(window.CHALLON_DATA);
var C = Object.assign({ API: "", GOOGLE_CLIENT_ID: "", DEMO: true, WEEK_DAYS: 7, TZ_OFFSET: 5, AUDIO_FILES: false, AUDIO_BASE: "audio/" }, window.CHALLON_CONFIG || {});
var KEY = "challon_v1", app = document.getElementById("app");
var qs = new URLSearchParams(location.search);
var dayShift = !C.API ? parseInt(qs.get("day") || "0", 10) || 0 : 0; // local test mode only: ?day=7 moves the calendar forward

/* ---------- storage ---------- */
var mem = null;
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return mem || {}; } }
function save() { mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
var S = load();
S.queue = S.queue || []; S.log = S.log || [];
var lang = S.lang || ((navigator.language || "uz").slice(0, 2));
if (I.langs.indexOf(lang) < 0) lang = "uz";
function t(k, n) { return I.t(lang, k, n); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function today() { return new Date(Date.now() + C.TZ_OFFSET * 36e5 + dayShift * 864e5).toISOString().slice(0, 10); }
var rnd = E.rng((Date.now() ^ (Math.random() * 1e9)) >>> 0);

/* ---------- server ---------- */
function api(action, body) {
  if (!C.API) return Promise.resolve(null);
  return fetch(C.API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action: action }, body)) })
    .then(function (r) { return r.json(); });
}
var flushing = false;
function flush() {
  if (!C.API || flushing || !S.queue.length || !S.profile || !S.profile.token) return;
  flushing = true;
  var rec = S.queue[0];
  api("save", { token: S.profile.token, session: rec, state: S.state }).then(function (r) {
    flushing = false;
    if (r && r.ok) { S.queue.shift(); save(); flush(); }
  }).catch(function () { flushing = false; });
}
window.addEventListener("online", flush);

/* ---------- audio ---------- */
var koVoice = null, voicesKnown = false, player = null;
function loadVoices() {
  if (!window.speechSynthesis) return;
  var v = speechSynthesis.getVoices();
  if (v.length) { voicesKnown = true; koVoice = v.filter(function (x) { return /^ko/i.test(x.lang); })[0] || null; }
}
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function audioMode() {
  if (C.AUDIO_FILES) return "file";
  if (!window.speechSynthesis || (voicesKnown && !koVoice)) return "text";
  return "tts";
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = 0.9; if (koVoice) u.voice = koVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function playItem(it, meta) {
  if (meta.am === "text") return;
  if (C.AUDIO_FILES) {
    try { if (player) player.pause(); player = new Audio(C.AUDIO_BASE + it.uid + ".mp3");
      player.onerror = function () { if (audioModeNoFile() === "tts") { meta.am = "tts"; speak(it.audio); } else { meta.am = "text"; draw(); } };
      player.play().catch(function () {}); } catch (e) {}
  } else speak(it.audio);
}
function audioModeNoFile() { return !window.speechSynthesis || (voicesKnown && !koVoice) ? "text" : "tts"; }
function stopAudio() { try { if (player) player.pause(); if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }

/* ---------- navigation ---------- */
var view = "login", cur = null, game = null, last = null;
function go(v) { view = v; stopAudio(); try { history.pushState({ v: v }, ""); } catch (e) {} draw(); window.scrollTo(0, 0); }
window.addEventListener("popstate", function () {
  if (view === "run") { if (canPrev()) prevQ(); try { history.pushState({ v: "run" }, ""); } catch (e) {} return; }
  if (view === "game" && game) { endGame(); return; }
  if (view !== "home" && view !== "login") { view = "home"; draw(); }
});
function draw() {
  document.documentElement.lang = lang;
  ({ login: vLogin, home: vHome, run: vRun, result: vResult, progress: vProgress, game: vGame })[view]();
}
function on(sel, fn) { Array.prototype.forEach.call(app.querySelectorAll(sel), function (el) { el.addEventListener("click", function (ev) { fn(el, ev); }); }); }
function brand() { return '<div class="brand" data-home style="cursor:pointer">CHALLON</div>'; }
document.addEventListener("click", function(e) {
  if (e.target.closest("[data-home]")) {
    if (view !== "login") go("home");
  }
});
/* ---------- login ---------- */
function vLogin() {
  var h = '<div class="login">' + brand() + '<p class="tag">' + esc(t("tagline")) + '</p>' +
    '<div class="card"><div class="label">' + esc(t("choose_lang")) + '</div><div class="langs">' +
    I.langs.map(function (l) { return '<button class="chip' + (l === lang ? " on" : "") + '" data-lang="' + l + '">' + esc(I.names[l]) + "</button>"; }).join("") + "</div></div>";
  if (GOOGLE) h += '<div class="card center"><div class="label">' + esc(t("login_google")) + '</div><div id="gg"></div><p class="hint">' + esc(t("login_hint")) + "</p></div>";
  if (C.DEMO || !GOOGLE) h +='<div class="card"><div class="label">' + esc(t("demo_title")) + '</div><input id="nm" maxlength="30" placeholder="' + esc(t("demo_name")) + '" autocomplete="off"><button class="btn" id="demo">' + esc(t("demo_start")) + "</button></div>";
  h += '<p class="fine">' + esc(t("consent")) + "</p></div>";
  app.innerHTML = h;
  on("[data-lang]", function (el) { lang = el.getAttribute("data-lang"); S.lang = lang; save(); draw(); });
  on("#demo", function () {
    var name = (document.getElementById("nm").value || "").trim() || "Student";
    var uid = "demo-" + Math.random().toString(36).slice(2, 10);
    if (C.API) api("login", { demo: name, uid: uid, lang: lang }).then(function (r) { signedIn(r && r.ok ? r : { uid: uid, name: name }); }).catch(function () { signedIn({ uid: uid, name: name }); });
    else signedIn({ uid: uid, name: name });
  });
  if (GOOGLE) googleButton();
}

/* ---------- Google sign-in ----------
   Google's script draws the button and, after the learner picks an account, hands us a signed
   "credential". The page cannot check that signature itself, so it is sent to the server, which
   asks Google. That is why the button only appears when both GOOGLE_CLIENT_ID and API are set. */
var GOOGLE = !!(C.GOOGLE_CLIENT_ID && C.API), gsiState = 0, gsiWait = [], gBusy = false; // gsiState: 0 not loaded, 1 loading, 2 ready
function gsi(cb) {
  if (gsiState === 2) return cb();
  gsiWait.push(cb);
  if (gsiState === 1) return;
  gsiState = 1;
  var s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = function () {
    if (!(window.google && google.accounts && google.accounts.id)) { gsiState = 0; gsiWait = []; return; }
    google.accounts.id.initialize({ client_id: C.GOOGLE_CLIENT_ID, callback: onGoogle, auto_select: false });
    gsiState = 2; gsiWait.splice(0).forEach(function (f) { f(); });
  };
  s.onerror = function () { gsiState = 0; gsiWait = []; s.remove(); alertBar(t("login_hint")); }; // blocked or offline: the next draw tries again
  document.head.appendChild(s);
}
function googleButton() {
  gsi(function () {
    var el = document.getElementById("gg"); // the learner may have left the login screen while the script was loading
    if (!el) return;
    el.innerHTML = "";
    google.accounts.id.renderButton(el, { type: "standard", theme: "outline", size: "large", shape: "pill", text: "signin_with", locale: lang, width: 260 });
  });
}
function onGoogle(resp) {
  if (gBusy || !resp || !resp.credential) return;
  gBusy = true;
  var card = document.getElementById("gg"); if (card) card.classList.add("busy");
  function done() { gBusy = false; var c = document.getElementById("gg"); if (c) c.classList.remove("busy"); }
  api("login", { google: resp.credential, lang: lang })
    .then(function (r) { done(); if (r && r.ok) signedIn(r); else alertBar((r && r.error) || "Login failed"); })
    .catch(function () { done(); alertBar("Network error"); });
}
function signedIn(r) {
  S.profile = { uid: r.uid, name: r.name || "", token: r.token || "" };
  var local = S.state && S.state.uid === r.uid ? S.state : null, remote = r.state || null;
  function size(s) { return s ? s.tests.length * 100 + s.nPrac : -1; }
  S.state = size(remote) > size(local) ? remote : (local || E.newState(r.uid, lang, today()));
  S.state.lang = lang; S.lang = lang; save(); go("home");
}
function alertBar(msg) { var d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3500); }

/* ---------- home ---------- */
function vHome() {
  var st = S.state, td = today(), h = '<div class="top">' + brand() + '<button class="link" id="out">' + esc(t("logout")) + "</button></div>";
  h += '<h1 class="hello">' + esc(t("hello")) + (S.profile.name ? ", " + esc(S.profile.name) : "") + "</h1>";
  if (st.plv !== null) {
    h += '<div class="stats"><div><b>L' + st.plv + "</b><span>" + esc(t("level")) + "</span></div><div><b>" + esc(t("grade", st.grade)) + "</b><span>" + esc(t("goal")) + "</span></div><div><b>" +
      E.streak(st, td) + "</b><span>" + esc(t("streak")) + "</span></div><div><b class='xp'>" + st.xp + "</b><span>XP</span></div></div>";
  }
  var dailyCount = (st.days ? Object.keys(st.days).filter(function(d) {
  return st.days[d];
}).length : 0);
var dailyProgress = Math.min(dailyCount, 30) + "/30";
  h += '<div class="card"><h2>TOPIK maqsadingizni tanlang</h2><select id="goalSelect" style="width:100%;padding:12px;font-size:16px;border-radius:8px">' +
  [1,2,3,4,5,6].map(function(n) {
    return '<option value="' + n + '"' + (st.grade === n ? ' selected' : '') + '>TOPIK ' + n + '</option>';
  }).join('') +
  '</select><button class="btn" id="saveGoal" style="margin-top:10px">Saqlash</button></div>';
  if (S.cur) h += card(S.cur.kind === "prac" ? t("today_title") : S.cur.kind === "place" ? t("place_title") : t("week_title"), (S.cur.i + 1) + " / " + S.cur.items.length, "resume", t("resume"), true);
  else if (st.plv === null) h += card(t("place_title"), t("place_desc"), "place", t("start"), true);
  else {
    var due = E.weekDue(st, td, C.WEEK_DAYS), wait = E.nextTestIn(st, td, C.WEEK_DAYS);
    if (due) h += card(t("week_title"), t("week_open", due), "week", t("start"), true);
    if (E.practicedToday(st, td)) h += card("Daily Practice (" + dailyProgress + ")", t("today_done"), null, null, false, "done");
    else h += card("Daily Practice (" + dailyProgress + ")", t("today_desc"), "prac", t("start"), !due);
    if (!due) h += card(t("week_title"), wait === null ? t("week_all") : t("week_wait", wait), null, null, false, "muted");
  }
  if (st.plv !== null) {
    h += card(t("game_title"), t("game_desc"), "game", t("start"), false);
    h += '<button class="btn ghost" id="prog">' + esc(t("progress")) + "</button>";
  }
  app.innerHTML = h;
  on("#saveGoal", function () {
  var selected = document.getElementById("goalSelect");
  if (!selected) return;
  S.state.grade = Number(selected.value);
  save();
  draw();
});
  on("#out", function () {
    if (gsiState === 2) google.accounts.id.disableAutoSelect(); // so a shared phone does not sign the next learner in as this one
    S.profile = null; save(); view = "login"; draw();
  });
  on("#prog", function () { go("progress"); });
  on("[data-act]", function (el) {
    var a = el.getAttribute("data-act");
    if (a === "resume") { cur = S.cur; go("run"); }
    if (a === "place") startSession("place", 0);
    if (a === "week") startSession("week", E.weekDue(S.state, today(), C.WEEK_DAYS));
    if (a === "prac") startSession("prac");
    if (a === "game") { game = null; go("game"); }
  });
}
function card(title, desc, act, btn, primary, cls) {
  return '<div class="card ' + (cls || "") + '"><h2>' + esc(title) + "</h2><p>" + esc(desc) + "</p>" +
    (act ? '<button class="btn' + (primary ? "" : " ghost") + '" data-act="' + act + '">' + esc(btn) + "</button>" : "") + "</div>";
}

/* ---------- session runner (placement, weekly test, daily practice) ---------- */
function startSession(kind, form) {
  if (kind !== "prac" && (form === null || form === undefined)) return;
  if (kind === "prac" && E.practicedToday(S.state, today())) return;
  var items = kind === "prac" ? E.pickPractice(S.state, B, rnd, lang) : E.buildTest(form, B, rnd, lang);
  cur = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind: kind, form: kind === "prac" ? null : form, items: items, i: 0,
    resp: [], meta: items.map(function () { return { ms: 0, chg: 0, skip: 0, am: "" }; }), date: today(), fb: false };
  S.cur = cur; save(); go("run");
}
var shownAt = 0;
function tick() { if (cur && shownAt) { cur.meta[cur.i].ms += Math.min(Date.now() - shownAt, 120000); } shownAt = Date.now(); }
document.addEventListener("visibilitychange", function () { if (document.hidden) { tick(); shownAt = 0; stopAudio(); } else shownAt = Date.now(); });
function isTest() { return cur.kind !== "prac"; }
function canPrev() { return cur && isTest() && cur.i % 4 > 0; }
function prevQ() { tick(); cur.i--; S.cur = cur; save(); stopAudio(); draw(); }
function answered() { var r = cur.resp[cur.i]; return r !== undefined && r !== null && r !== "" && !(Array.isArray(r) && !r.length); }
function respValue(i) { var r = cur.resp[i], it = cur.items[i]; if (r === undefined || r === null) return null; return it.mode === "tiles" ? r.map(function (k) { return it.tiles[k]; }).join("") : r; }

function vRun() {
  var it = cur.items[cur.i], meta = cur.meta[cur.i], n = cur.items.length, r = cur.resp[cur.i];
  if (it.audio && !meta.am) meta.am = audioMode();
  var h = '<div class="runhead"><button class="link" id="quit">✕</button><div class="bar"><i style="width:' + Math.round(cur.i / n * 100) + '%"></i></div><span class="count">' + (cur.i + 1) + " / " + n + "</span></div>";
  h += '<div class="qtag">' + esc(t("skill_" + it.skill)) + " · " + esc(t("i_" + it.type)) + "</div>";
  if (it.audio) {
    if (meta.am === "text") h += '<div class="note">' + esc(t("text_mode")) + '</div><div class="passage">' + esc(it.script || it.audio).replace(/\n/g, "<br>") + "</div>";
    else h += '<div class="center"><button class="audio" id="play">▶ ' + esc(t("play")) + '</button><br><button class="link small" id="nosound">' + esc(t("no_sound")) + "</button></div>";
  }
  if (it.stem) h += '<div class="' + (it.big ? "stem big" : it.q ? "passage" : "stem") + '">' + esc(it.stem) + "</div>";
  if (it.q) h += '<div class="question">' + esc(it.q) + "</div>";
  var locked = cur.fb;
  if (it.mode === "mc") {
    h += '<div class="opts">' + it.opts.map(function (o, k) {
      var c = "opt" + (r === k ? " sel" : "");
      if (locked) c += k === it.ans ? " good" : r === k ? " bad" : "";
      return '<button class="' + c + '" data-o="' + k + '"' + (locked ? " disabled" : "") + ">" + esc(o) + "</button>";
    }).join("") + "</div>";
  } else {
    var picked = r || [];
    h += '<div class="hint">' + esc(t("tiles_hint")) + '</div><div class="slots" id="slots">' + picked.map(function (k, pos) {
      return '<button class="tile on" data-p="' + pos + '"' + (locked ? " disabled" : "") + ">" + esc(it.tiles[k]) + "</button>"; }).join("") + "</div>";
    h += '<div class="tiles">' + it.tiles.map(function (c, k) {
      return '<button class="tile" data-t="' + k + '"' + (picked.indexOf(k) >= 0 || locked ? " disabled" : "") + ">" + esc(c) + "</button>"; }).join("") + "</div>";
  }
  if (locked) {
    var ok = E.check(it, respValue(cur.i));
    h += '<div class="fb ' + (ok ? "good" : "bad") + '"><b>' + esc(t(ok ? "correct" : "wrong")) + "</b>" + (ok ? "" : "<div>" + esc(t("answer_is")) + ": " + esc(it.mode === "tiles" ? it.answer : it.opts[it.ans]) + "</div>") + '<div class="reveal">' + esc(it.reveal) + "</div></div>";
  if (!ok) {
  h += '<div class="note" style="margin-top:12px;padding:14px;background:#fff3e0;border-radius:8px;">';
  h += '<b>Nima uchun xato?</b><p>';
  h += esc(it.explanation || (
  (it.stem || "").includes("음악을") ?
  "들으면서 = tinglayotgan holda. -(으)면서 grammatikasi ikki harakat bir vaqtda bajarilishini bildiradi. 음악을 들으면서 공부해요 — Musiqa tinglab dars qilaman." :
  "To‘g‘ri javobni yuqorida ko‘ring. Savolning grammatik tuzilishini qayta o‘rganing."
));
  h += '</p></div>';
  }
}
  var lastQ = cur.i === n - 1;
  h += '<div class="foot">';
  if (isTest()) h += '<button class="btn ghost" id="prev"' + (canPrev() ? "" : " disabled") + ">" + esc(t("prev")) + "</button>";
  if (!locked) h += '<button class="btn ghost" id="skip">' + esc(t("dont_know")) + "</button>";
  if (isTest()) h += '<button class="btn" id="next"' + (answered() ? "" : " disabled") + ">" + esc(t(lastQ ? "finish" : "next")) + "</button>";
  else if (!locked) h += '<button class="btn" id="check"' + (answered() ? "" : " disabled") + ">" + esc(t("check")) + "</button>";
  else h += '<button class="btn" id="next">' + esc(t(lastQ ? "finish" : "next")) + "</button>";
  h += "</div>";
  app.innerHTML = h;
  shownAt = shownAt || Date.now();

  on("#quit", function () { tick(); shownAt = 0; S.cur = cur; save(); cur = null; go("home"); });
  on("#play", function () { playItem(it, meta); });
  on("#nosound", function () { meta.am = "text"; stopAudio(); draw(); });
  on("[data-o]", function (el) { var k = +el.getAttribute("data-o"); if (r !== undefined && r !== null && r !== k) meta.chg++; cur.resp[cur.i] = k; meta.skip = 0; S.cur = cur; save(); draw(); });
  on("[data-t]", function (el) { var a = (cur.resp[cur.i] || []).slice(); a.push(+el.getAttribute("data-t")); cur.resp[cur.i] = a; meta.skip = 0; S.cur = cur; save(); draw(); });
  on("[data-p]", function (el) { var a = cur.resp[cur.i].slice(); a.splice(+el.getAttribute("data-p"), 1); meta.chg++; cur.resp[cur.i] = a; S.cur = cur; save(); draw(); });
  on("#prev", function () { if (canPrev()) prevQ(); });
  on("#skip", function () { cur.resp[cur.i] = null; meta.skip = 1; if (isTest()) advance(); else { cur.fb = true; S.cur = cur; save(); stopAudio(); draw(); } });
  on("#check", function () { if (!answered()) return; cur.fb = true; S.cur = cur; save(); stopAudio(); draw(); });
  on("#next", function () { if (isTest() && !answered()) return; advance(); });
}
function advance() {
  tick(); stopAudio(); cur.fb = false;
  var oks = [];
  for (var k = 0; k <= cur.i; k++) oks.push(E.check(cur.items[k], respValue(k)));
  if (cur.i === cur.items.length - 1 || (isTest() && E.testStop(oks))) return finish(oks);
  cur.i++; S.cur = cur; save(); draw(); window.scrollTo(0, 0);
}
function finish(oks) {
  var st = S.state, sec = Math.round(cur.meta.reduce(function (a, m) { return a + m.ms; }, 0) / 1000), r, before = E.summary(st);
  while (oks.length < cur.items.length) oks.push(false);
  if (isTest()) r = E.applyTest(st, cur.form, cur.items, oks, cur.date, sec);
  else r = E.applyPractice(st, cur.items, oks, cur.date, sec);
  var rec = { id: cur.id, kind: cur.kind, form: cur.form, date: cur.date, ts: Date.now(), sec: sec, n: cur.items.length, correct: r.correct, score: isTest() ? r.score : null, xp: r.xp, plv: st.plv, lang: lang,
    rows: cur.items.map(function (it, i) { var m = cur.meta[i]; return { u: it.uid, t: it.type, sk: it.skill, lv: it.lv, ok: oks[i] ? 1 : 0, seen: i <= cur.i ? 1 : 0, ms: m.ms, chg: m.chg, skip: m.skip, am: m.am, rc: it.recycled ? 1 : 0 }; }) };
  pushRecord(rec);
  last = { kind: cur.kind, form: cur.form, r: r, base: before.base };
  cur = null; S.cur = null; shownAt = 0; save(); go("result");
}
function pushRecord(rec) {
  S.queue.push(rec);
  S.log.push({ id: rec.id, kind: rec.kind, form: rec.form, date: rec.date, sec: rec.sec, n: rec.n, correct: rec.correct, score: rec.score, xp: rec.xp });
  if (S.log.length > 120) S.log = S.log.slice(-120);
  if (!C.API) S.queue = [];
  save(); flush();
  if (C.API && !navigator.onLine) alertBar(t("saved_local"));
}

/* ---------- result ---------- */
function bars(sk) {
  return E.SKILLS.map(function (s) { var p = sk[s][1] ? Math.round(sk[s][0] / sk[s][1] * 100) : 0;
    return '<div class="row"><span>' + esc(t("skill_" + s)) + '</span><div class="bar"><i style="width:' + p + '%"></i></div><b>' + sk[s][0] + "/" + sk[s][1] + "</b></div>"; }).join("");
}
function vResult() {
  if (!last) { view = "home"; return draw(); }
  var r = last.r, st = S.state, h = '<div class="top">' + brand() + '</div><h1>' + (last.kind === "place" ? "Initial Placement Test Result" : esc(t("result"))) + '</h1>';
  if (last.kind === "prac") {
    h += '<div class="card center"><div class="bigscore">' + r.correct + " / " + r.n + '</div><div class="xp">+' + r.xp + " " + esc(t("xp_earned")) + "</div></div>";
    r.events.forEach(function (e) {
      if (e.e === "level_up") h += '<div class="card good">' + esc(t("level_up")) + " L" + e.to + "</div>";
      if (e.e === "level_down") h += '<div class="card muted">' + esc(t("level_down")) + "</div>";
      if (e.e === "overcome") h += '<div class="card good">' + esc(t("overcome")) + ": " + esc(t("n_" + e.type)) + "</div>";
    });
  } else {
    h += '<div class="card center"><div class="label">' + esc(t("score")) + '</div><div class="bigscore">' + r.score + '<small> / 100</small></div>';
    if (last.form > 0 && last.base !== null) { var d = r.score - last.base; h += '<div class="delta ' + (d >= 0 ? "up" : "down") + '">' + esc(t("vs_start")) + ": " + (d > 0 ? "+" : "") + d + "</div>"; }
    h += '<div class="xp">+' + r.xp + " " + esc(t("xp_earned")) + "</div></div>";
    if (last.form === 0) h += '<div class="card center"><div class="label">' + esc(t("your_level")) + '</div><div class="lvl">L' + st.plv + '</div><div>' + esc(t("goal")) + ": <b>" + esc(t("grade", st.grade)) + "</b></div></div>";
    h += '<div class="card">' + bars(r.sk) + "</div>";
  }
  h += '<button class="btn" id="home">' + esc(t("home")) + "</button>";
  app.innerHTML = h;
  on("#home", function () { go("home"); });
}

/* ---------- progress ---------- */
function vProgress() {
  var st = S.state, s = E.summary(st), h = '<div class="top">' + brand() + '<button class="link" id="home">' + esc(t("home")) + "</button></div><h1>" + esc(t("progress")) + "</h1>";
  h += '<div class="stats"><div><b>' + s.minutes + "</b><span>" + esc(t("minutes")) + "</span></div><div><b>" + s.days + "</b><span>" + esc(t("days")) + "</span></div><div><b class='xp'>" + st.xp + "</b><span>XP</span></div></div>";
  var ts = st.tests.slice().sort(function (a, b) { return a.form - b.form; });
  h += '<div class="card"><h2>' + esc(t("tests")) + '</h2><div class="chart">' + ts.map(function (x) {
    return '<div class="col"><b>' + x.score + '</b><i style="height:' + Math.max(4, x.score) + '%"' + (x.form ? "" : ' class="base"') + "></i><span>" + esc(x.form ? t("t_week", x.form) : t("t_base")) + "</span></div>"; }).join("") + "</div>";
  if (s.gain !== null) h += '<div class="delta ' + (s.gain >= 0 ? "up" : "down") + '">' + esc(t("vs_start")) + ": " + (s.gain > 0 ? "+" : "") + s.gain + "</div>";
  h += "</div>";
  h += '<div class="card"><h2>' + esc(t("skills")) + "</h2>" + E.SKILLS.map(function (k) { var a = E.skillAcc(st, k), p = a === null ? 0 : Math.round(a * 100);
    return '<div class="row"><span>' + esc(t("skill_" + k)) + '</span><div class="bar"><i style="width:' + p + '%"></i></div><b>' + (a === null ? "–" : p + "%") + "</b></div>"; }).join("") + "</div>";
  var over = Object.keys(st.types).filter(function (k) { return st.types[k].over; });
  function list(a) { return a.length ? a.map(function (k) { return '<span class="pill">' + esc(t("n_" + k)) + "</span>"; }).join("") : '<span class="fine">' + esc(t("none_yet")) + "</span>"; }
  h += '<div class="card"><h2>' + esc(t("weak")) + "</h2>" + list(s.weak) + "<h2 style='margin-top:16px'>" + esc(t("overcame")) + "</h2>" + list(over) + "</div>";
  app.innerHTML = h;
  on("#home", function () { go("home"); });
}

/* ---------- word game ---------- */
function vGame() {
  var h = '<div class="top">' + brand() + '<button class="link" id="stop">' + esc(t(game ? "game_stop" : "home")) + "</button></div>";
  if (!game) {
    h += "<h1>" + esc(t("game_title")) + '</h1><p class="tag">' + esc(t("game_pick")) + '</p><div class="card"><h2>' + esc(t("game_match")) + '</h2><button class="btn" data-g="match">' + esc(t("start")) + '</button></div><div class="card"><h2>' + esc(t("game_quiz")) + '</h2><button class="btn" data-g="quiz">' + esc(t("start")) + "</button></div>";
    app.innerHTML = h;
    on("#stop", function () { go("home"); });
    on("[data-g]", function (el) { game = { mode: el.getAttribute("data-g"), correct: 0, tries: 0, active: 0, lastTap: Date.now(), t0: Date.now() }; newRound(); draw(); });
    return;
  }
  h += '<div class="stats"><div><b>' + game.correct + "</b><span>✓</span></div><div><b class='xp'>" + E.gameXp(game.correct, game.active) + "</b><span>XP</span></div></div>";
  if (game.mode === "match") {
    h += '<div class="match"><div>' + game.left.map(function (w) { return '<button class="opt' + (game.done[w.id] ? " good" : game.pick === w.id ? " sel" : "") + '" data-l="' + w.id + '"' + (game.done[w.id] ? " disabled" : "") + ">" + esc(w.ko) + "</button>"; }).join("") +
      "</div><div>" + game.right.map(function (w) { return '<button class="opt' + (game.done[w.id] ? " good" : game.miss === w.id ? " bad" : "") + '" data-r="' + w.id + '"' + (game.done[w.id] ? " disabled" : "") + ">" + esc(E.meaning(w, lang)) + "</button>"; }).join("") + "</div></div>";
  } else {
    var it = game.item;
    if (it.audio) h += '<div class="center"><button class="audio" id="play">▶ ' + esc(t("play")) + "</button></div>";
    if (it.stem) h += '<div class="stem big">' + esc(it.stem) + "</div>";
    h += '<div class="opts">' + it.opts.map(function (o, k) { var c = "opt"; if (game.shown !== null) c += k === it.ans ? " good" : k === game.shown ? " bad" : "";
      return '<button class="' + c + '" data-q="' + k + '"' + (game.shown !== null ? " disabled" : "") + ">" + esc(o) + "</button>"; }).join("") + "</div>";
  }
  app.innerHTML = h;
  on("#stop", endGame);
  on("#play", function () { speak(game.item.audio); });
  on("[data-l]", function (el) { tap(); game.pick = el.getAttribute("data-l"); game.miss = null; draw(); });
  on("[data-r]", function (el) {
    if (!game.pick) return; tap(); game.tries++;
    var id = el.getAttribute("data-r");
    if (id === game.pick) { game.done[id] = 1; game.correct++; game.pick = null; if (Object.keys(game.done).length === game.left.length) newRound(); }
    else game.miss = id;
    draw();
  });
  on("[data-q]", function (el) {
    tap(); game.tries++; game.shown = +el.getAttribute("data-q");
    if (game.shown === game.item.ans) game.correct++;
    draw();
    var g = game; setTimeout(function () { if (game === g && view === "game") { newRound(); draw(); } }, 700);
  });
}
function tap() { var now = Date.now(); game.active += Math.min(20, (now - game.lastTap) / 1000); game.lastTap = now; }
function newRound() {
  if (game.correct >= 10) {
    endGame();
    return;
  }
  if (game.mode === "match") { var w = E.gameWords(S.state, B, rnd, 4); game.left = E.shuffle(w, rnd); game.right = E.shuffle(w, rnd); game.done = {}; game.pick = null; game.miss = null; }
  else { var x = E.gameWords(S.state, B, rnd, 1)[0], ty = ["MV", "VM", "MV", "VM", "LW"][Math.floor(rnd() * (audioModeNoFile() === "tts" ? 5 : 4))]; game.item = E.makeItem(x, ty, B, rnd, lang); game.shown = null; }
}
function endGame() {
  var g = game; game = null; stopAudio();
  if (g && g.tries) {
    var sec = Math.round(g.active), xp = E.gameXp(g.correct, g.active);
    S.state.xp += xp; S.state.sec.game += sec;
    pushRecord({ id: Date.now().toString(36), kind: "game", form: g.mode, date: today(), ts: Date.now(), sec: sec, n: g.tries, correct: g.correct, score: null, xp: xp, plv: S.state.plv, lang: lang, rows: [] });
  }
  view = "home"; draw();
}

/* ---------- boot ---------- */
if (S.profile && S.state) { view = "home"; flush(); }
try { history.replaceState({ v: view }, ""); history.pushState({ v: view }, ""); } catch (e) {}
draw();
window.CHALLON_DEBUG = { state: function () { return S; }, today: today };
})();
</script>
</body>
</html>
