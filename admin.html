<title>CHALLON 관리자</title>
<style>
:root{--bg:#F4F2EC;--card:#fff;--ink:#16202E;--mut:#5C6675;--line:#E2DED3;--pri:#0E5A52;--tint:#E6F0EE;--good:#2F7D4F;--bad:#B3402E;--amber:#B9741A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif}
#app{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}
.brand{font-weight:800;letter-spacing:.2em;color:var(--pri);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.warn{background:#FBF1DF;border:1px solid #EBD5A8;color:#7A5210;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi b{display:block;font-size:24px;line-height:1.2}.kpi span{color:var(--mut);font-size:12.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
input,button,select{font:inherit}
input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;min-width:220px}
button{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--pri)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12.5px;color:var(--mut);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:#fff}
tbody tr{cursor:pointer}tbody tr:hover{background:#FAF8F3}tr.sel{background:var(--tint)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}.mut{color:var(--mut)}
.barrow{display:flex;align-items:center;gap:10px;margin:7px 0}.barrow span{width:110px}.barrow .bar{flex:1;height:14px;background:#ECE8DE;border-radius:4px;overflow:hidden}.barrow i{display:block;height:100%;background:var(--pri)}.barrow b{width:86px;text-align:right}
.pill{display:inline-block;background:var(--tint);color:var(--pri);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;margin:0 4px 4px 0}
.pill.w{background:#FAEAE6;color:var(--bad)}
svg text{font-size:11px;fill:#5C6675}
h2.sec{font-size:16px;margin:22px 0 10px;color:var(--pri)}
.big{font-size:44px;font-weight:800;line-height:1.1;color:var(--pri)}
.big small{font-size:18px;color:var(--mut);font-weight:600}
.small{font-size:12.5px}
select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px}
.card h2{color:var(--ink)}
</style>
</head>

<script>
/* CHALLON learning engine: pure logic shared by the app, the admin page and the simulation tests. */
(function (root) {
var E = {};
E.PRACTICE_N = 8;
E.TYPES = {
  VM: { sk: "R", k: "w" }, MV: { sk: "R", k: "w" }, GC: { sk: "R", k: "s" }, RD: { sk: "R", k: "p" },
  LW: { sk: "L", k: "w" }, LD: { sk: "L", k: "w" }, LC: { sk: "L", k: "s" }, LP: { sk: "L", k: "d" },
  SP: { sk: "W", k: "w" }, WS: { sk: "W", k: "s" }
};
E.SKILLS = ["R", "L", "W"];

E.rng = function (seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
function shuffle(arr, rnd) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
E.shuffle = shuffle;
function chars(s) { return Array.from(s.replace(/\s/g, "")); }
E.chars = chars;

/* ---------- bank ---------- */
function word(str, id, lv) { var p = str.split("|"); return { id: id, k: "w", lv: lv, ko: p[0], em: p[1], uz: p[2], ru: p[3], en: p[4] }; }
function sent(str, id, lv) {
  var p = str.split("|"), m = p[0].match(/\[(.+?)\]/);
  return { id: id, k: "s", lv: lv, full: p[0].replace(/[\[\]]/g, ""), stem: p[0].replace(/\[.+?\]/, "＿＿＿"),
    blank: m[1], dis: p[1] ? p[1].split(",") : [] };
}
function quest(str, id, lv, k) { var p = str.split("|"); return { id: id, k: k, lv: lv, text: p[0], q: p[1], opts: p.slice(2) }; }

E.parse = function (D) {
  var B = { words: [], sents: [], pass: [], dlg: [], test: [], byId: {}, D: D };
  D.WORDS.forEach(function (l, lv) { l.forEach(function (s, i) { B.words.push(word(s, "W" + lv + "-" + i, lv)); }); });
  D.SENTS.forEach(function (l, lv) { l.forEach(function (s, i) { B.sents.push(sent(s, "S" + lv + "-" + i, lv)); }); });
  D.PASS.forEach(function (l, lv) { l.forEach(function (s, i) { B.pass.push(quest(s, "P" + lv + "-" + i, lv, "p")); }); });
  D.DLG.forEach(function (l, lv) { l.forEach(function (s, i) { B.dlg.push(quest(s, "D" + lv + "-" + i, lv, "d")); }); });
  B.words.concat(B.sents, B.pass, B.dlg).forEach(function (u) { B.byId[u.id] = u; });
  B.syl = []; // filler syllables for tile items
  B.sents.forEach(function (s) { chars(s.blank).forEach(function (c) { if (B.syl.indexOf(c) < 0) B.syl.push(c); }); });
  D.TEST.forEach(function (F, f) {
    var p = "T" + f + "-", T = [];
    F.w0.forEach(function (s, i) { T.push({ u: word(s, p + "w0" + i, 0), type: ["VM", "MV", "LW", "SP"][i] }); });
    T.push({ u: word(F.w1, p + "w1", 1), type: "VM" });
    T.push({ u: sent(F.s1[0], p + "s10", 1), type: "GC" });
    T.push({ u: sent(F.s1[1], p + "s11", 1), type: "LC" });
    T.push({ u: sent(F.s1[2], p + "s12", 1), type: "WS" });
    for (var i = 0; i < 3; i++) {
      var lv = i + 2;
      T.push({ u: quest(F.rd[i], p + "rd" + i, lv, "p"), type: "RD" });
      T.push({ u: sent(F.gc[i], p + "gc" + i, lv), type: "GC" });
      T.push({ u: quest(F.lp[i], p + "lp" + i, lv, "d"), type: "LP" });
      T.push({ u: sent(F.ws[i], p + "ws" + i, lv), type: "WS" });
    }
    B.test.push(T);
  });
  return B;
};

/* ---------- items ---------- */
function meaning(w, lang) { var t = w[lang === "ko" ? "en" : lang] || w.en; return (w.em ? w.em + " " : "") + t; }
E.meaning = meaning;
function others(B, w, n, rnd) {
  var pool = B.words.filter(function (x) { return x.lv === w.lv && x.ko !== w.ko && x.uz !== w.uz && x.ru !== w.ru && x.en !== w.en; });
  return shuffle(pool, rnd).slice(0, n);
}
function mc(correct, wrong, rnd) {
  var opts = shuffle([correct].concat(wrong), rnd);
  return { opts: opts, ans: opts.indexOf(correct) };
}
function tiles(answer, extra, rnd) {
  var a = chars(answer), ex = [];
  shuffle(extra, rnd).forEach(function (c) { if (ex.length < 3 && a.indexOf(c) < 0 && ex.indexOf(c) < 0) ex.push(c); });
  return shuffle(a.concat(ex), rnd);
}
E.canType = function (u, type) {
  var T = E.TYPES[type];
  if (!T || T.k !== u.k) return false;
  if (type === "SP" || type === "LD") return chars(u.ko).length >= 2;
  if (type === "WS") return chars(u.blank).length >= 2;
  return true;
};
E.speech = function (text) { return text.replace(/(여자|남자):\s*/g, "").replace(/\n/g, " "); };

E.makeItem = function (u, type, B, rnd, lang) {
  var it = { uid: u.id, type: type, skill: E.TYPES[type].sk, lv: u.lv, mode: "mc" }, m, ot;
  if (u.k === "w") {
    ot = others(B, u, 3, rnd);
    if (type === "VM") { it.stem = u.ko; it.big = 1; m = mc(meaning(u, lang), ot.map(function (o) { return meaning(o, lang); }), rnd); }
    if (type === "MV") { it.stem = meaning(u, lang); it.big = 1; m = mc(u.ko, ot.map(function (o) { return o.ko; }), rnd); }
    if (type === "LW") { it.audio = u.ko; m = mc(u.ko, ot.map(function (o) { return o.ko; }), rnd); }
    if (type === "SP" || type === "LD") {
      it.mode = "tiles"; it.answer = u.ko;
      if (type === "SP") { it.stem = meaning(u, lang); it.big = 1; } else it.audio = u.ko;
      it.tiles = tiles(u.ko, [].concat.apply([], ot.map(function (o) { return chars(o.ko); })), rnd);
    }
    it.reveal = u.ko + " = " + meaning(u, lang);
  } else if (u.k === "s") {
    it.stem = u.stem;
    if (type === "LC") it.audio = u.full;
    if (type === "WS") {
      it.mode = "tiles"; it.answer = u.blank.replace(/\s/g, "");
      it.tiles = tiles(u.blank, [].concat.apply([], u.dis.map(chars)).concat(B.syl), rnd);
    } else m = mc(u.blank, u.dis, rnd);
    it.reveal = u.full;
  } else {
    if (type === "LP") { it.audio = E.speech(u.text); it.script = u.text; } else it.stem = u.text;
    it.q = u.q;
    m = mc(u.opts[0], u.opts.slice(1), rnd);
    it.reveal = u.opts[0];
  }
  if (m) { it.opts = m.opts; it.ans = m.ans; }
  var tgt = E.targetOf(u);
  it.sino = E.isSino(tgt, B);
  it.root = E.rootOf(tgt, B);
  it.l1 = E.l1key(u, type, B);
  return it;
};
/* 이 문항이 실제로 묻는 한국어 문자열 */
E.targetOf = function (u) { return u.k === "w" ? u.ko : u.k === "s" ? u.blank : (u.opts ? u.opts[0] : ""); };
E.check = function (item, resp) {
  if (resp === null || resp === undefined) return false;
  return item.mode === "tiles" ? String(resp).replace(/\s/g, "") === item.answer.replace(/\s/g, "") : resp === item.ans;
};


/* ---------- 차별 기능: 한자어 태그 / 모국어 대조 / 오류 원인 ----------
   모두 규칙 기반 자동 분류다. 사람이 문항마다 붙인 태그가 아니다. */
var ASP = /[ㅋㅌㅍㅊㄲㄸㅃㅆㅉ]/;
function decomp(ch) { // 한글 음절 -> 초성·종성 인덱스
  var c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return { cho: Math.floor(c / 588), jong: c % 28 };
}
var CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
E.hasAspirate = function (t) {
  return Array.from(String(t)).some(function (ch) { var d = decomp(ch); return d && ASP.test(CHO[d.cho]); });
};
E.hasBatchim = function (t) {
  return Array.from(String(t)).some(function (ch) { var d = decomp(ch); return d && d.jong > 0; });
};
E.isSino = function (t, B) {
  var s = String(t || ""), L = B && B.D && B.D.SINO ? B.D.SINO : [];
  for (var i = 0; i < L.length; i++) if (s.indexOf(L[i]) >= 0) return true;
  return false;
};
function inList(t, list) {
  var s = String(t || "");
  for (var i = 0; i < list.length; i++) if (s.indexOf(list[i]) >= 0) return true;
  return false;
}
/* 한자 어근 태그. 목록 순서대로 먼저 맞는 어근 하나만 붙인다. 없으면 null */
E.rootOf = function (t, B) {
  var s = String(t || ""), R = B && B.D && B.D.ROOTS ? B.D.ROOTS : [];
  if (!s) return null;
  for (var i = 0; i < R.length; i++) {
    for (var j = 0; j < R[i].w.length; j++) if (s.indexOf(R[i].w[j]) >= 0) return R[i].k;
  }
  return null;
};
E.rootDef = function (key, B) {
  var R = B && B.D && B.D.ROOTS ? B.D.ROOTS : [];
  for (var i = 0; i < R.length; i++) if (R[i].k === key) return R[i];

/* ---------- 부재 알림 ---------- */
function noticeSection(rows) {
  var h = '<h2 class="sec">' + esc(t("noteSec")) + '</h2><div class="card"><p class="mut small">' + esc(t("noteHow")) + "</p>";
  var st = { 0: 0, 1: 0, 2: 0 };
  rows.forEach(function (x) { var s = x.notify ? num(x.notify.stage) : 0; st[s > 2 ? 2 : s]++; });
  var back = 0, byUid = {};
  notices.forEach(function (n) { byUid[String(n.uid)] = n; });
  rows.forEach(function (x) { if (byUid[x.uid] && x.notify && num(x.notify.stage) === 0) back++; });
  var kp = [[t("noteOk"), st[0]], [t("note1"), st[1]], [t("note2"), st[2]], [t("noteSent"), notices.length], [t("noteBack"), back]];
  h += '<div class="kpis">' + kp.map(function (k) { return '<div class="kpi"><b>' + esc(k[1]) + "</b><span>" + esc(k[0]) + "</span></div>"; }).join("") + "</div>";
  var waiting = rows.filter(function (x) { return x.notify && num(x.notify.stage) > 0; })

    h += '<div class="scroll"><table><thead><tr><th>' + esc(t("name")) + "</th><th>" + esc(t("grp")) + "</th><th>" + esc(t("noteAbsent")) + "</th><th>" + esc(t("kind")) + "</th></tr></thead><tbody>" +
      waiting.map(function (x) {
        return "<tr><td>" + esc(x.name) + "</td><td>" + esc(x.grp || "–") + "</td><td>" + (x.notify.absentH === null ? "–" : x.notify.absentH) +
          "</td><td>" + esc(num(x.notify.stage) === 2 ? t("note2") : t("note1")) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  return h + "</div>";
}

/* ---------- 그리기 ---------- */
function draw() {
  var rows = users.map(row);

  if (C.API) h += '<input id="key" type="password" placeholder="' + esc(t("keyph")) + '" value="' + esc(adminKey) + '"> <button id="load">' + esc(users.length ? t("refresh") : t("login")) + "</button> ";
  if (users.length) h += '<button class="ghost" id="out">' + esc(t("logout")) + "</button> ";

  var ginfo = applyGroups(rows);

    [t("avgGain"), gains.length ? (mean(gains) > 0 ? "+" : "") + mean(gains).toFixed(1) : "–"],
    [t("gainers"), gains.length ? gains.filter(function (g) { return g > 0; }).length : "–"],
    [t("avgMin"), Math.round(mean(rows.map(function (x) { return x.minutes; })) || 0)],
    [t("perHour"), nz(median(tested.filter(function (x) { return x.gph !== null; }).map(function (x) { return x.gph; })), 1)],
    [t("corr"), r2 === null ? "–" : r2.toFixed(2)]

  if (sessions.length) kpis.push([t("sessions"), sessions.length],

  h += '<div class="grid">';

    '</div><p class="mut">' + esc(t("defendD")) + (dn ? " · " + co.defend.held + " / " + dn : "") + "</p></div>";
  var eks = Object.keys(co.err).sort(function (a, b) { return co.err[b] - co.err[a]; });

    return '<div class="barrow"><span>' + esc(k + " " + nm) + '</span><div class="bar"><i style="width:' + pct(co.err[k], etot) + '%"></i></div><b>' + co.err[k] + " (" + pct(co.err[k], etot) + "%)</b></div>";
  }).join("") : '<p class="mut">' + esc(t("none")) + "</p>") + "</div></div>";

  h += '<div class="grid"><div class="card"><h2>' + esc(t("sinoCmp")) + "</h2>" +
    [[t("sinoY"), co.sino], [t("sinoN"), co.other]].map(function (p) {
      return '<div class="barrow"><span>' + esc(p[0]) + '</span><div class="bar"><i style="width:' + pct(p[1].c, p[1].n) + '%"></i></div><b>' + (p[1].n ? pct(p[1].c, p[1].n) + "% (" + p[1].n + ")" : "–") + "</b></div>";
    }).join("") + "</div>";

    (l1k.length ? l1k.map(function (k) {

      return "<tr><td>" + esc((d.n && d.n[lang]) || d.ko) + "</td><td>" + esc(d.sk) + "</td><td>" + g.n + "</td><td>" + pct(g.c, g.n) + "%</td></tr>";

    return '<div class="barrow"><span>' + esc(b[0] + " " + t("days")) + ' <span class="mut">(' + g.length + ')</span></span><div class="bar"><i style="width:' + Math.max(0, Math.min(100, (m || 0) * 2.5)) + '%"></i></div><b>' + (m === null ? "–" : (m > 0 ? "+" : "") + m.toFixed(1)) + "</b></div>";

  h += '<div class="card"><h2>' + esc(t("scatter")) + "</h2>" + scatter(tested) + "</div></div>";

  /* --- 학생 표 --- */

  list.sort(function (a, b) { var x = a[sortKey], y = b[sortKey]; if (x === null) return 1; if (y === null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  var cols = [["name", t("name")], ["grp", t("grp")], ["idx", t("grpIdxAvg")], ["lvl0", t("lvl0")], ["plv", t("plv")], ["grade", t("goal")], ["profile", t("exam")], ["base", t("base")], ["last", t("last")], ["gain", t("gain")],
    ["defend", t("defend")], ["sinoAcc", t("sinoY")], ["nTests", t("wtests")], ["days", t("days")], ["minutes", t("mins")], ["gph", t("gph")], ["xp", "XP"], ["weak", t("weakN")], ["over", t("overN")]];
  h += '<h2 class="sec">' + esc(t("table")) + " (" + list.length + ')</h2><div class="card"><input id="q" placeholder="' + esc(t("search")) + '" value="' + esc(query) + '"><div class="scroll"><table><thead><tr>' +
    cols.map(function (c) { return '<th data-k="' + c[0] + '">' + esc(c[1]) + (sortKey === c[0] ? (sortDir > 0 ? " ▲" : " ▼") : "") + "</th>"; }).join("") + "</tr></thead><tbody>" +
    (list.length ? list.map(function (x) {
      var G = D.GROUPS[x.grp];
      return '<tr data-u="' + esc(x.uid) + '"' + (selected === x.uid ? ' class="sel"' : "") + "><td>" + esc(x.name) +
        "</td><td>" + (G ? '<b style="color:' + G.color + '">' + esc(lang === "ko" ? G.ko : G.uz) + "</b>" : '<span class="mut">–</span>') +
        "</td><td>" + nz(x.idx, 1) + "</td><td>" + (x.lvl0 === null ? "–" : "L" + x.lvl0) + "</td><td>" + (x.plv === null ? "–" : "L" + x.plv) +
        "</td><td>" + (x.grade === null ? "–" : "TOPIK " + x.grade) + "</td><td>" + esc(x.profile === "eps" ? "EPS" : "학술") + "</td><td>" + nz(x.base) + "</td><td>" + nz(x.last) + "</td><td>" + signed(x.gain) +
        "</td><td>" + (x.defend === null ? "–" : x.defend + "%") + "</td><td>" + (x.sinoAcc === null ? "–" : x.sinoAcc + "%") + "</td><td>" + x.nTests + "</td><td>" + x.days + "</td><td>" + x.minutes + "</td><td>" + nz(x.gph, 1) +
        "</td><td>" + x.xp + "</td><td>" + x.weak + "</td><td>" + x.over + "</td></tr>";
    }).join("") : '<tr><td colspan="' + cols.length + '" class="mut">' + esc(t("noStudent")) + "</td></tr>") + "</tbody></table></div></div>";

  if (selected) { var u = list.concat(rows).filter(function (x) { return x.uid === selected; })[0]; if (u) h += detail(u); }
  app.innerHTML = h; bind(rows);
}

function scatter(rows) {
  if (!rows.length) return '<p class="mut">' + esc(t("noTest")) + "</p>";
  var W = 520, H = 230, Lf = 34, Bm = 26;
  var mx = Math.max.apply(null, rows.map(function (r) { return r.minutes; })) || 1;
  var lo = Math.min(-10, Math.min.apply(null, rows.map(function (r) { return r.gain; })));
  var hi = Math.max(10, Math.max.apply(null, rows.map(function (r) { return r.gain; })));
  function X(v) { return Lf + v / mx * (W - Lf - 10); }
  function Y(v) { return 8 + (hi - v) / (hi - lo) * (H - Bm - 8); }
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img"><line x1="' + Lf + '" x2="' + (W - 10) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="#C9C3B4"/><line x1="' + Lf + '" x2="' + Lf + '" y1="8" y2="' + (H - Bm) + '" stroke="#C9C3B4"/>' +
    '<text x="4" y="' + (Y(hi) + 8) + '">+' + hi + '</text><text x="4" y="' + (Y(0) + 4) + '">0</text><text x="4" y="' + Y(lo) + '">' + lo + '</text>' +
    '<text x="' + (W - 10) + '" y="' + (H - 6) + '" text-anchor="end">' + mx + '분</text><text x="' + Lf + '" y="' + (H - 6) + '">0</text>' +
    rows.map(function (r) { return '<circle cx="' + X(r.minutes).toFixed(1) + '" cy="' + Y(r.gain).toFixed(1) + '" r="4" fill="#0E5A52" fill-opacity=".55"><title>' + esc(r.name + ": " + r.minutes + "분, " + r.gain) + "</title></circle>"; }).join("") + "</svg>";
}

    ["XP", num(st.xp)], [t("defend"), u.defend === null ? "–" : u.defend + "%"],

  }).join("");
  var ue = st.errs || {}, uek = Object.keys(ue).sort(function (a, b) { return ue[b] - ue[a]; });
  h += "<h2 style='margin-top:14px'>" + esc(t("errDist")) + "</h2>" + (uek.length ? uek.map(function (k) {
    return '<span class="pill">' + esc(k + " " + (D.ERR[k] ? (D.ERR[k][lang] || D.ERR[k].ko) : k) + " · " + ue[k]) + "</span>"; }).join("") : '<span class="mut">' + esc(t("none")) + "</span>");
  var ur = st.roots || {}, urk = Object.keys(ur).sort(function (a, b) { return ur[a].c / ur[a].n - ur[b].c / ur[b].n; });
  h += "<h2 style='margin-top:14px'>" + esc(t("rootSec")) + "</h2>" + (urk.length ? urk.map(function (k) {
    var d = E.rootDef(k, B) || { s: "" };
    return '<span class="pill">' + esc(k + d.s + " " + pct(ur[k].c, ur[k].n) + "% (" + ur[k].n + ")") + "</span>"; }).join("") : '<span class="mut">' + esc(t("none")) + "</span>");
  h += "</div></div>";

  var mine = sessions.filter(function (s) { return String(s.uid) === u.uid && (kindFilter === "all" || s.kind === kindFilter); })
    .sort(function (a, b) { return String(b.ts).localeCompare(String(a.ts)); });
  if (sessions.length) {

    h += '<h2 style="margin-top:16px">' + esc(t("history")) + '</h2><select id="kind"><option value="all">' + esc(t("allKinds")) + "</option>" +

    h += '<div class="scroll"><table><thead><tr><th>' + esc(t("date")) + "</th><th>" + esc(t("kind")) + "</th><th>" + esc(t("result")) + "</th><th>" + esc(t("score")) + "</th><th>" + esc(t("time")) + "</th><th>XP</th></tr></thead><tbody>" +
      (mine.length ? mine.map(function (s) {
        return "<tr><td>" + esc(String(s.date).slice(0, 10)) + "</td><td>" + esc(KN[s.kind] || s.kind) + "</td><td>" + num(s.correct) + " / " + num(s.n) + " (" + pct(num(s.correct), num(s.n)) + "%)</td><td>" +
          (s.score === null || s.score === "" ? "–" : esc(s.score)) + "</td><td>" + num(s.sec) + "s</td><td>" + num(s.xp) + "</td></tr>";
      }).join("") : '<tr><td colspan="6" class="mut">' + esc(t("none")) + "</td></tr>") + "</tbody></table></div>";
  }
  return h + "</div>";
}

/* ---------- 동작 ---------- */
function bind(rows) {
  function q(s) { return app.querySelector(s); }
  if (q("#lang")) q("#lang").onclick = function () { lang = lang === "ko" ? "uz" : "ko"; try { localStorage.setItem("challon_admin_lang", lang); } catch (e) {} draw(); };
  if (q("#load")) q("#load").onclick = function () { adminKey = q("#key").value; load(); };
  if (q("#out")) q("#out").onclick = function () { users = []; sessions = []; responses = []; agg = null; place = {}; groupRows = []; notices = []; respPlace = null; selected = null; sample = false; partial = false; adminKey = ""; draw(); };
  if (q("#sample")) q("#sample").onclick = function () {
    var d = simulate(); users = d.users; sessions = d.sessions; responses = d.responses; notices = d.notices;
    agg = null; place = {}; groupRows = []; respPlace = null; groupMsg = ""; sample = true; partial = false; err = ""; selected = null; draw();
  };
  if (q("#freeze")) q("#freeze").onclick = function () { freeze(rows, false); };
  if (q("#unfreeze")) q("#unfreeze").onclick = function () { freeze(rows, true); };
  if (q("#csv")) q("#csv").onclick = function () { exportCsv(rows); };
  if (q("#q")) { var inp = q("#q"); inp.oninput = function () { query = inp.value; draw(); var n = app.querySelector("#q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }; }
  if (q("#kind")) q("#kind").onchange = function () { kindFilter = q("#kind").value; draw(); };
  Array.prototype.forEach.call(app.querySelectorAll("th[data-k]"), function (th) {
    th.onclick = function () { var k = th.getAttribute("data-k"); if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; } draw(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll("tr[data-u]"), function (tr) {
    tr.onclick = function () { selected = tr.getAttribute("data-u"); draw(); var d = document.getElementById("detail"); if (d) d.scrollIntoView({ behavior: "smooth" }); };
  });
}
function load() {
  if (!adminKey) { err = t("needKey"); return draw(); }
  err = t("loading"); draw();
  fetch(C.API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "admin", key: adminKey }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) { err = (d && d.error) || "불러오지 못했습니다."; users = []; return draw(); }
      users = (d.users || []).filter(function (u) { return u.state; });
      sessions = Array.isArray(d.sessions) ? d.sessions : [];
      responses = Array.isArray(d.responses) ? d.responses : [];
      agg = d.agg && d.agg.total ? d.agg : null;
      place = d.place || {}; groupRows = d.groups || []; notices = d.notices || []; respPlace = null; groupMsg = "";
      partial = !Array.isArray(d.sessions) || !Array.isArray(d.responses);
      sample = false; err = ""; selected = null; draw();
    })
    .catch(function () { err = t("noNet"); users = []; draw(); });
}
/* 계산한 분류를 서버에 박아 둔다. 해제하면 다시 잠정 계산으로 돌아간다. */
function freeze(rows, clear) {
  if (!C.API || !adminKey) { groupMsg = t("needKey"); return draw(); }
  var payload = clear ? [] : rows.filter(function (x) { return x.calcGrp; }).map(function (x) {
    return { uid: x.uid, name: x.name, grp: x.calcGrp, idx: x.idx, rank: x.rank, score: x.base };
  });
  groupMsg = t("loading"); draw();
  fetch(C.API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "setgroups", key: adminKey, groups: payload, clear: !!clear }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) { groupMsg = (d && d.error) || "실패"; return draw(); }
      groupRows = clear ? [] : payload.map(function (p) { return { uid: p.uid, name: p.name, grp: p.grp, idx: p.idx, rank: p.rank, score: p.score }; });
      groupMsg = clear ? "" : t("grpSaved"); draw();
    })
    .catch(function () { groupMsg = t("noNet"); draw(); });
}

function exportCsv(rows) {
  var head = ["uid", "name", "lang", "joined", "control_group", "group_index", "group_rank", "exam_profile", "placement_level", "current_level", "goal_grade", "placement_score", "latest_score", "gain",
    "defend_rate", "sino_accuracy", "top_error", "weekly_tests", "practice_days", "minutes", "gain_per_hour", "xp", "weak_types", "overcome", "notify_stage", "absent_hours"];
  var lines = [head].concat(rows.map(function (x) {
    return [x.uid, x.name, x.lang, x.joined, x.grp, x.idx, x.rank, x.profile, x.lvl0, x.plv, x.grade, x.base, x.last, x.gain, x.defend, x.sinoAcc, x.topErr,
      x.nTests, x.days, x.minutes, x.gph, x.xp, x.weak, x.over, x.notify ? x.notify.stage : "", x.notify ? x.notify.absentH : ""];
  }));
  /* 어근별 집계: 배치 대비 주간시험 변화까지 한 표에 */
  var R = cohort(rows).roots || {};
  var rk = Object.keys(R);
  if (rk.length) {
    lines.push([]); lines.push(["--- sino roots ---"]);
    lines.push(["root", "syllable", "meaning_ko", "words", "items", "correct", "accuracy", "first_half_items", "first_half_accuracy", "second_half_items", "second_half_accuracy", "delta", "place_items", "place_accuracy", "week_items", "week_accuracy"]);
    rk.forEach(function (k) {
      var g = R[k], d = E.rootDef(k, B) || { s: "", ko: k, w: [] };
      var p = num(g.pn) ? pct(num(g.pc), num(g.pn)) : "", w = num(g.wn) ? pct(num(g.wc), num(g.wn)) : "";
      var e = num(g.en) ? pct(num(g.ec), num(g.en)) : "", l = num(g.ln) ? pct(num(g.lc), num(g.ln)) : "";
      lines.push([k, d.s, d.ko, d.w.join(" "), g.n, g.c, pct(g.c, g.n), num(g.en), e, num(g.ln), l, e === "" || l === "" ? "" : l - e, num(g.pn), p, num(g.wn), w]);
    });
  }
  if (responses.length) {
    lines.push([]); lines.push(["--- responses ---"]);
    lines.push(["uid", "control_group", "session_id", "unit", "type", "skill", "level", "ok", "first_ok", "error", "l1_pattern", "sino", "root", "ms", "changes", "skipped"]);
    var grpOf = {}; rows.forEach(function (x) { grpOf[x.uid] = x.grp; });
    responses.forEach(function (r) { lines.push([r.uid, grpOf[String(r.uid)] || "", r.session_id, r.unit, r.type, r.skill, r.level, r.ok, r.fok, r.err, r.l1, r.sino, r.root, r.ms, r.changes, r.skipped]); });
  }
  var csv = "﻿" + lines.map(function (l) { return l.map(function (c) { return '"' + String(c === null || c === undefined ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "challon_export.csv"; a.click();
}

/* ---------- 가상 데이터 (화면 확인용) ---------- */
function simulate() {
  var names = ["Aziz", "Dilnoza", "Jasur", "Madina", "Sardor", "Nigora", "Bekzod", "Zarina", "Otabek", "Shahlo"];
  var U = [], S = [], R = [], N = [];
  function day(n) { return new Date(Date.UTC(2026, 10, 16) + n * 864e5).toISOString().slice(0, 10); }
  for (var i = 0; i < 100; i++) {
    var rnd = E.rng(7000 + i), ability = i < 40 ? -1 + rnd() * 0.9 : 0.3 + rnd() * 3.2, attend = 0.15 + rnd() * 0.85, learned = 0;
    var st = E.newState("sample-" + i, i % 3 ? "uz" : "ru", day(0));
    st.profile = i % 5 === 0 ? "eps" : "academic";
    var uid = st.uid;
    function answer(it) {
      var p = Math.max(0.03, Math.min(0.97, 0.5 + (ability + learned - it.lv) * 0.35)), k = rnd() < p;
      return it.mode === "tiles" ? (k ? it.answer : null) : (k || rnd() < 0.25 ? it.ans : (it.ans + 1) % 4);
    }
    function recsOf(items, oks) {
      return items.map(function (it, j) {
        var changed = rnd() < 0.18;
        return { ok: oks[j], firstOk: changed && !oks[j] ? true : (oks[j] && rnd() < 0.12), pick: it.mode === "mc" ? (oks[j] ? it.ans : (it.ans + 1) % 4) : null, ms: 3000 + Math.floor(rnd() * 20000), skip: !oks[j] && rnd() < 0.1 ? 1 : 0 };
      });
    }
    function push(kind, form, items, oks, recs, d, sec, score, xp) {
      var sid = uid + "-" + S.length;
      S.push({ uid: uid, session_id: sid, kind: kind, form: form, date: d, ts: d + "T10:00:00Z", n: items.length, correct: oks.filter(Boolean).length, score: score, sec: sec, xp: xp });
      items.forEach(function (it, j) {
        R.push({ uid: uid, session_id: sid, kind: kind, unit: it.uid, type: it.type, skill: it.skill, level: it.lv, seen: 1, ok: oks[j] ? 1 : 0,
          fok: recs[j].firstOk ? 1 : 0, err: E.classify(it, recs[j]) || "", l1: it.l1 || "", sino: it.sino ? 1 : 0, root: it.root || "", ms: recs[j].ms, changes: 0, skipped: recs[j].skip });
      });
    }
    function test(f, d) {
      var items = E.buildTest(f, B, rnd, st.lang), oks = [];
      for (var j = 0; j < items.length; j++) { oks.push(E.check(items[j], answer(items[j]))); if (E.testStop(oks)) break; }
      while (oks.length < items.length) oks.push(false);
      var recs = recsOf(items, oks), sec = 240 + Math.floor(rnd() * 240);
      var r = E.applyTest(st, f, items, oks, d, sec, recs);
      push(f === 0 ? "place" : "week", f, items, oks, recs, d, sec, r.score, 30);
    }
    test(0, day(0));
    var lastD = 0;
    for (var d2 = 0; d2 < 28; d2++) {
      var due = E.weekDue(st, day(d2), 7);
      if (due && rnd() < attend + 0.2) { test(due, day(d2)); lastD = d2; }
      if (rnd() > attend) continue;
      lastD = d2;
      var items = E.pickPractice(st, B, rnd, st.lang), oks = items.map(function (it) { return E.check(it, answer(it)); });
      var recs = recsOf(items, oks), sec = 300 + Math.floor(rnd() * 240);
      var pr = E.applyPractice(st, items, oks, day(d2), sec, recs);
      push("prac", null, items, oks, recs, day(d2), sec, null, pr.xp);
      learned += 0.035;
      if (rnd() < 0.3) { var g = 60 + Math.floor(rnd() * 240); st.sec.game += g; var gx = E.gameXp(Math.floor(g / 6), g); st.xp += gx;
        S.push({ uid: uid, session_id: uid + "-g" + d2, kind: "game", form: "match", date: day(d2), ts: day(d2) + "T20:00:00Z", n: 10, correct: 7, score: null, sec: g, xp: gx }); }
    }
    /* 부재 알림 상태: 마지막 학습일로부터 얼마나 지났는지로 단계를 만든다 */
    var absentH = (27 - lastD) * 24, stage = absentH >= 66 ? 2 : absentH >= 48 ? 1 : 0;
    var nm = names[i % 10] + " " + (i + 1);
    if (stage >= 1) N.push({ ts: day(27) + "T19:00:00Z", uid: uid, email: "s" + i + "@example.com", stage: stage, absent_hours: absentH });
    U.push({ uid: uid, name: nm, username: "u" + i, state: st, notify: { stage: stage, at: "", absentH: absentH, lastLoginH: absentH } });
  }
  return { users: U, sessions: S, responses: R, notices: N };
}
draw();
})();
